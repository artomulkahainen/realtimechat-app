services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: realtimechat-backend
        restart: unless-stopped
        ports:
            - '3001:3001'
        environment:
            DB_HOST: 'db'
            DB_USER: 'postgres'
            DB_PASSWORD: 'testdb'
            DB_NAME: 'chatdb'
            DB_PORT: 5435
            PORT: '3001'
        depends_on:
            - db

    db:
        image: postgres:17-alpine
        container_name: realtimechat-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: testdb
            POSTGRES_DB: chatdb
        ports:
            - '5435:5435'
        volumes:
            - pg_data:/var/lib/postgresql/data

volumes:
    pg_data:
